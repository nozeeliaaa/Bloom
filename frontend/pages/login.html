<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Bloom</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />

  <style>
    .auth-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 120px);
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
    }
    .auth-card h1 {
      text-align: center;
      color: var(--color-primary-dark);
      margin-bottom: 0.35rem;
    }
    .auth-card .subtitle {
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .auth-links {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.9rem;
    }
    .auth-links a { font-weight: 600; }
    .brand-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-primary);
      text-decoration: none;
      margin-bottom: 1.5rem;
    }
    .brand-link img { height: 72px; width: auto; }

    .forgot-link {
      font-size: 0.85rem;
      text-align: right;
      display: block;
      margin-top: 0.25rem;
    }

    /* Reset panel (hidden by default) */
    #reset-panel { display: none; }
  </style>
</head>

<body>
  <main class="auth-page">
    <div class="card auth-card">
      <a href="/pages/home.html" class="brand-link" aria-label="Bloom home">
        <img src="/assets/bloom-logo.png" alt="Bloom" />
      </a>

      <!-- â”€â”€ Login panel â”€â”€ -->
      <div id="login-panel">
        <h1>Welcome Back</h1>
        <p class="subtitle">Log in to access your synced data and advanced features.</p>

        <div id="error-msg"   class="banner banner-warning hidden" role="alert"></div>
        <div id="success-msg" class="banner banner-success hidden" role="status"></div>

        <!-- Unverified email notice (hidden until needed) -->
        <div id="verify-notice" class="banner banner-warning hidden" role="alert">
          <p id="verify-text"></p>
          <button class="btn btn-outline btn-sm" id="btn-resend" type="button"
            style="margin-top:0.5rem;">
            Resend verification email
          </button>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" required
              autocomplete="email" placeholder="you@example.com" />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input class="form-input" type="password" id="password" name="password" required
              autocomplete="current-password" placeholder="Your password" />
            <a href="#" class="forgot-link" id="btn-forgot">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">
            Log In
          </button>
        </form>

        <div class="auth-links">
          <p>Don't have an account? <a href="/pages/register.html">Create one</a></p>
          <p style="margin-top:0.75rem;">
            <a href="#" id="btn-anon">Continue anonymously instead</a>
          </p>
        </div>
      </div>

      <!-- â”€â”€ Password reset panel â”€â”€ -->
      <div id="reset-panel">
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your email and we'll send a reset link.</p>

        <div id="reset-error"   class="banner banner-warning hidden" role="alert"></div>
        <div id="reset-success" class="banner banner-success hidden" role="status"></div>

        <div class="form-group">
          <label class="form-label" for="reset-email">Email</label>
          <input class="form-input" type="email" id="reset-email" placeholder="you@example.com"
            autocomplete="email" />
        </div>

        <button class="btn btn-primary btn-block" id="btn-send-reset" type="button">
          Send Reset Link
        </button>

        <div class="auth-links" style="margin-top:1rem;">
          <a href="#" id="btn-back-login">&larr; Back to login</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { showBloomLoader, runBloomLoader } from "/js/loadingOverlay.js";
    import { login, sendPasswordReset, resendVerificationEmail, getIdToken } from '/js/auth.js';
    import { setMode } from '/js/mode.js';
    import { isFirebaseConfigured } from '/js/firebase.js';
    import { renderFooter } from '/js/utils.js';
    import { setUserGoal } from '/js/goals.js';
    import {
      isOnboardingCompleteFromProfileData,
      isOnboardingCompleteLocal,
      markOnboardingCompleteLocal,
    } from '/js/onboarding.js';

    renderFooter();

    const loginPanel   = document.getElementById('login-panel');
    const resetPanel   = document.getElementById('reset-panel');
    const form         = document.getElementById('login-form');
    const errorMsg     = document.getElementById('error-msg');
    const successMsg   = document.getElementById('success-msg');
    const verifyNotice = document.getElementById('verify-notice');
    const verifyText   = document.getElementById('verify-text');
    const loginBtn     = document.getElementById('login-btn');

    // Stores email+password temporarily for resend flow
    let _unverifiedEmail = null;
    let _unverifiedPassword = null;

    function getMailboxUrl(email) {
      const domain = (email || '').split('@')[1]?.toLowerCase() || '';
      if (domain === 'gmail.com' || domain === 'googlemail.com') return 'https://mail.google.com';
      if (domain === 'yahoo.com' || domain.startsWith('yahoo.'))  return 'https://mail.yahoo.com';
      if (['outlook.com','hotmail.com','live.com','msn.com','hotmail.co.uk','live.co.uk'].includes(domain)) return 'https://outlook.live.com';
      if (['icloud.com','me.com','mac.com'].includes(domain)) return 'https://www.icloud.com/mail';
      if (domain === 'aol.com') return 'https://mail.aol.com';
      if (domain === 'protonmail.com' || domain === 'proton.me') return 'https://mail.proton.me';
      return null;
    }

    function openInboxLink(email) {
      const url = getMailboxUrl(email);
      if (!url) return '';
      return ` <a href="${url}" target="_blank" rel="noopener" style="font-weight:700;">Open my inbox &rarr;</a>`;
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.classList.remove('hidden');
      successMsg.classList.add('hidden');
      verifyNotice.classList.add('hidden');
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.classList.remove('hidden');
      errorMsg.classList.add('hidden');
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = 6000) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } catch (_) {
        return null;
      } finally {
        clearTimeout(timer);
      }
    }

    function hasProfileObject(value) {
      return !!(value && typeof value === "object" && Object.keys(value).length > 0);
    }

    async function hasSavedCycleLogs(apiBase, headers) {
      const res = await fetchWithTimeout(
        `${apiBase}/api/logs?start=2000-01-01&end=2100-12-31`,
        { headers },
        3500
      );
      if (!res?.ok) return false;
      const data = await res.json().catch(() => null);
      return Array.isArray(data?.items) && data.items.length > 0;
    }

    const goPostAuth = async () => {
      showBloomLoader({ message: "Preparing Bloom", sub: "Syncing your experience..." });

      const fastRestore = (async () => {
        let profileStatus = "indeterminate";
        try {
          const token = await getIdToken({ waitForAuthMs: 2500 });
          if (!token) return "indeterminate";

          const apiBase = window.BLOOM_API_BASE ?? '';
          const headers = { Authorization: `Bearer ${token}` };
          const [profileRes, prefsRes] = await Promise.all([
            fetchWithTimeout(`${apiBase}/api/user/profile`, { headers }, 6000),
            fetchWithTimeout(`${apiBase}/api/preferences`, { headers }, 3500),
          ]);

          if (profileRes?.ok) {
            const data = await profileRes.json();
            const profile = data && typeof data === "object" ? (data.profile || null) : null;
            const healthProfile = data?.healthProfile || {};
            const biometricProfile = data?.biometricProfile || {};
            const completedOnboarding = isOnboardingCompleteFromProfileData(data);
            const hasStoredProfile = hasProfileObject(profile);
            profileStatus = data?.degraded ? "indeterminate" : (completedOnboarding ? "found" : "missing");

            // Sync role immediately so the nav renders the Admin link on the next page
            const role = data?.role ?? data?.profile?.role ?? "user";
            localStorage.setItem("bloom_user_role", role || "user");
            localStorage.setItem("bloom_is_admin", role === "admin" ? "1" : "0");
            localStorage.setItem("bloom_role_synced_at", String(Date.now()));
            if (completedOnboarding) {
              markOnboardingCompleteLocal();
            }
            if (hasStoredProfile) {
              let realGoal = profile.goal;
              if (!realGoal || realGoal === "track_cycle") realGoal = "period";
              else if (realGoal === "no_period") realGoal = "track_symptoms";
              setUserGoal(realGoal);

              const restored = {};
              if (profile.nickname)       restored.nickname       = profile.nickname;
              if (profile.yearOfBirth) {
                restored.yob = profile.yearOfBirth;
                restored.yearOfBirth = profile.yearOfBirth;
              }
              if (profile.ageBand) restored.ageBand = profile.ageBand;
              const avgCycleLength = healthProfile.avgCycleLength;
              const periodDuration = healthProfile.periodDuration;
              const sleepScore = biometricProfile.sleepScore ?? healthProfile.sleepScore ?? profile.sleepScore;
              const activityLevel = biometricProfile.activityLevel ?? profile.activityLevel;
              const stressLevel = biometricProfile.stressLevel ?? profile.stressLevel;
              const weightKg = healthProfile.weightKg;
              const heightCm = healthProfile.heightCm;
              const lmpDate = healthProfile.lmpDate ?? healthProfile.lmp ?? profile.lmpDate ?? profile.lmp ?? null;
              if (avgCycleLength != null) restored.avgCycleLength = avgCycleLength;
              if (periodDuration != null) restored.periodDuration = periodDuration;
              if (sleepScore != null) restored.sleepScore = sleepScore;
              if (activityLevel) restored.activityLevel = activityLevel;
              if (stressLevel) restored.stressLevel = stressLevel;
              if (weightKg != null) restored.weightKg = weightKg;
              if (heightCm != null) restored.heightCm = heightCm;
              if (profile.avatar) localStorage.setItem('bloom_avatar', profile.avatar);
              if (realGoal === "pregnancy" && lmpDate) localStorage.setItem("bloom_lmp", lmpDate);
              else localStorage.removeItem("bloom_lmp");
              localStorage.setItem('bloom_profile', JSON.stringify(restored));
            }
          } else if (profileRes) {
            console.error("[Bloom] profile fetch failed:", profileRes.status);
          }

          if (profileStatus === "missing" && await hasSavedCycleLogs(apiBase, headers)) {
            markOnboardingCompleteLocal();
            profileStatus = "found";
          }

          if (prefsRes?.ok) {
            const prefsData = await prefsRes.json();
            const prefs = prefsData?.preferences;
            if (prefs) {
              const local = {
                hideSensitive: !!prefs.hideSensitive,
                compact: !!prefs.compact,
                reminders: !!(prefs.reminders?.enabled),
                periodReminder: !!(prefs.reminders?.types?.includes('PERIOD_SOON')),
                fertileAlert: !!(prefs.reminders?.types?.includes('FERTILE_WINDOW')),
                discreetNotif: !!(prefs.reminders?.discreetCopy),
              };
              if (prefs.theme) local.theme = prefs.theme;
              localStorage.setItem('bloom_preferences', JSON.stringify(local));
            }
          }
        } catch (e) {
          console.error("[Bloom] login restore error:", e);
          return "indeterminate";
        }
        return profileStatus;
      })();

      await runBloomLoader({
        minMs: 320,
        tickMs: 80,
        stepMin: 18,
        stepMax: 30,
      });

      const restoreStatus = await fastRestore;

      // Minor check - if under 18 without approved consent, send to consent-pending
      try {
        const restoredProfile = JSON.parse(localStorage.getItem('bloom_profile') || '{}');
        const yob = restoredProfile.yob || restoredProfile.yearOfBirth;
        if (yob) {
          const age = new Date().getFullYear() - Number(yob);
          if (age >= 10 && age <= 17) {
            const tok = await getIdToken();
            const apiBase = window.BLOOM_API_BASE ?? '';
            const consentRes = await fetch(`${apiBase}/api/consent/status`, {
              headers: { Authorization: `Bearer ${tok}` },
            }).catch(() => null);
            const consentData = consentRes?.ok ? await consentRes.json().catch(() => null) : null;
            if (consentData?.status === 'denied') {
              window.location.href = '/pages/consent-denied.html';
              return;
            }
            if (!consentData || consentData.status !== 'approved') {
              window.location.href = '/pages/consent-pending.html';
              return;
            }
          }
        }
      } catch (_) {}

      const onboarded = isOnboardingCompleteLocal();
      const target = onboarded ? '/pages/dashboard.html' : '/pages/survey.html';
      window.location.href = target;
    };

    // â”€â”€ Login â”€â”€
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');
      successMsg.classList.add('hidden');
      verifyNotice.classList.add('hidden');

      if (!isFirebaseConfigured()) {
        showError('Firebase is not configured. Please continue anonymously.');
        return;
      }

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Please fill in all fields.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        await login(email, password);
        setMode('account');
        localStorage.setItem("bloom_show_mode_banner_once", "1");
        await goPostAuth();
        return;

      } catch (err) {
        console.error("[Bloom] login error:", err?.code || err?.message || err);
        if (err.code === 'auth/email-not-verified') {
          // Show the resend verification notice
          _unverifiedEmail = email;
          _unverifiedPassword = password;
          verifyText.innerHTML =
            `Your email (${email}) hasn't been verified yet. ` +
            `Check your inbox or resend the verification email below.` +
            openInboxLink(email);
          verifyNotice.classList.remove('hidden');
          errorMsg.classList.add('hidden');

        } else {
          let msg = 'Login failed. Please check your credentials.';
          if (err.code === 'auth/user-not-found' ||
              err.code === 'auth/wrong-password' ||
              err.code === 'auth/invalid-credential') {
            msg = 'Invalid email or password. Please try again.';
          } else if (err.code === 'auth/user-disabled') {
            msg = 'This account has been disabled. Ask an admin to enable it, or delete it if this email needs a new account.';
          } else if (err.code === 'auth/too-many-requests') {
            msg = 'Too many attempts. Please try again later.';
          } else if (err.code === 'auth/network-request-failed') {
            msg = 'Network error while signing in. Check your connection and try again.';
          } else if (err.code === 'auth/invalid-api-key' || err.code === 'auth/app-not-authorized') {
            msg = 'Authentication is temporarily unavailable due to app configuration. Please try again shortly.';
          } else if (err.code) {
            msg = `Login failed (${err.code}). Please try again.`;
          }
          showError(msg);
        }
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });

    // â”€â”€ Resend verification â”€â”€
    document.getElementById('btn-resend').addEventListener('click', async () => {
      const btn = document.getElementById('btn-resend');
      if (!_unverifiedEmail || !_unverifiedPassword) {
        showError('Please try logging in again first.');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        await resendVerificationEmail(_unverifiedEmail, _unverifiedPassword);
        verifyText.innerHTML =
          `Verification email resent to ${_unverifiedEmail}. Please check your inbox.` +
          openInboxLink(_unverifiedEmail);
        btn.style.display = 'none';
      } catch (e) {
        showError('Could not resend. Please try again shortly.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Resend verification email';
      }
    });

    // â”€â”€ Forgot password â†’ show reset panel â”€â”€
    document.getElementById('btn-forgot').addEventListener('click', (e) => {
      e.preventDefault();
      // Pre-fill reset email from whatever was typed in login
      const emailVal = document.getElementById('email').value.trim();
      if (emailVal) document.getElementById('reset-email').value = emailVal;

      loginPanel.style.display = 'none';
      resetPanel.style.display = 'block';
    });

    // â”€â”€ Send reset link â”€â”€
    document.getElementById('btn-send-reset').addEventListener('click', async () => {
      const btn        = document.getElementById('btn-send-reset');
      const resetError = document.getElementById('reset-error');
      const resetOk    = document.getElementById('reset-success');
      const email      = document.getElementById('reset-email').value.trim();

      resetError.classList.add('hidden');
      resetOk.classList.add('hidden');

      if (!email) {
        resetError.textContent = 'Please enter your email address.';
        resetError.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        await sendPasswordReset(email);
        resetOk.innerHTML =
          `Reset link sent to ${email}. Check your inbox.` +
          openInboxLink(email);
        resetOk.classList.remove('hidden');
        btn.style.display = 'none';
      } catch (err) {
        let msg = 'Could not send reset email. Please try again.';
        if (err.code === 'auth/user-not-found') {
          msg = 'No account found with that email.';
        } else if (err.code === 'auth/invalid-email') {
          msg = 'Please enter a valid email address.';
        }
        resetError.textContent = msg;
        resetError.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        if (btn.style.display !== 'none') btn.textContent = 'Send Reset Link';
      }
    });

    // â”€â”€ Back to login â”€â”€
    document.getElementById('btn-back-login').addEventListener('click', (e) => {
      e.preventDefault();
      resetPanel.style.display = 'none';
      loginPanel.style.display = 'block';
      document.getElementById('reset-error').classList.add('hidden');
      document.getElementById('reset-success').classList.add('hidden');
      document.getElementById('btn-send-reset').style.display = '';
    });

    // â”€â”€ Anonymous â”€â”€
    document.getElementById('btn-anon').addEventListener('click', (e) => {
      e.preventDefault();
      setMode('anon');
      goPostAuth();
    });
  </script>
</body>
</html>
