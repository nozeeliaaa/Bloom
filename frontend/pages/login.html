<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Bloom</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />


<style>
    .auth-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 120px);
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
    }
    .auth-card h1 {
      text-align: center;
      color: var(--color-primary-dark);
      margin-bottom: 0.35rem;
    }
    .auth-card .subtitle {
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .auth-links {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.9rem;
    }
    .auth-links a {
      font-weight: 600;
    }
    .brand-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-primary);
      text-decoration: none;
      margin-bottom: 1.5rem;
    }
    .brand-link svg { width: 24px; height: 24px; }
  </style>
    <link rel="stylesheet" href="/css/main.css" />
  </head>

<body>
  <main class="auth-page">
    <div class="card auth-card">
      <!-- IMPORTANT: don't jump to dashboard from the logo -->
      <a href="/pages/login.html" class="brand-link" aria-label="Bloom home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2c1.5 0 3 1.5 3 4s-1.5 4-3 4-3-1.5-3-4 1.5-4 3-4z" />
          <path d="M22 12c0 1.5-1.5 3-4 3s-4-1.5-4-3 1.5-3 4-3 4 1.5 4 3z" />
          <path d="M12 22c-1.5 0-3-1.5-3-4s1.5-4 3-4 3 1.5 3 4-1.5 4-3 4z" />
          <path d="M2 12c0-1.5 1.5-3 4-3s4 1.5 4 3-1.5 3-4 3-4-1.5-4-3z" />
        </svg>
        Bloom
      </a>

      <h1>Welcome Back</h1>
      <p class="subtitle">Log in to access your synced data and advanced features.</p>

      <div id="error-msg" class="banner banner-warning hidden" role="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" required autocomplete="email"
            placeholder="you@example.com" />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" required
            autocomplete="current-password" placeholder="Your password" />
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-btn">Log In</button>
      </form>

      <div class="auth-links">
        <p>Don't have an account? <a href="/pages/register.html">Create one (18+)</a></p>
        <p style="margin-top:0.75rem;">
          <a href="#" id="btn-anon">Continue anonymously instead</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module">
    import { showBloomLoader, runBloomLoader } from "/js/loadingOverlay.js";
    import { login } from '/js/auth.js';
    import { setMode } from '/js/mode.js';
    import { isFirebaseConfigured } from '/js/firebase.js';
    import { renderFooter } from '/js/utils.js';

    renderFooter();

    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const loginBtn = document.getElementById('login-btn');
    const anonBtn = document.getElementById('btn-anon');

    const goPostAuth = async () => {
      const onboarded = localStorage.getItem('bloom_onboarded') === '1';
      const target = onboarded ? '/pages/dashboard.html' : '/pages/survey.html';

      showBloomLoader({ message: "Preparing Bloom", sub: "Syncing your experience…" });
      await runBloomLoader({ targetUrl: target });
};


    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');

      if (!isFirebaseConfigured()) {
        errorMsg.textContent = 'Firebase is not configured. Please set up Firebase or continue anonymously.';
        errorMsg.classList.remove('hidden');
        return;
      }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        errorMsg.textContent = 'Please fill in all fields.';
        errorMsg.classList.remove('hidden');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      try {
        await login(email, password);
        setMode('account'); // ✅ ensure mode is correct
        localStorage.setItem("bloom_show_mode_banner_once", "1");
        goPostAuth();       // ✅ survey only if first time

      } catch (err) {
        let msg = 'Login failed. Please check your credentials.';
        if (
          err?.code === 'auth/user-not-found' ||
          err?.code === 'auth/wrong-password' ||
          err?.code === 'auth/invalid-credential'
        ) {
          msg = 'Invalid email or password. Please try again.';
        } else if (err?.code === 'auth/too-many-requests') {
          msg = 'Too many attempts. Please try again later.';
        }
        errorMsg.textContent = msg;
        errorMsg.classList.remove('hidden');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Log In';
      }
    });

    // ✅ Continue anonymously: set mode, then route based on "first time" flag
    anonBtn.addEventListener('click', (e) => {
      e.preventDefault();
      setMode('anon');
      goPostAuth();
    });
  </script>
</body>
</html>
