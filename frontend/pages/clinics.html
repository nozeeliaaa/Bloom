<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Finder - Bloom</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet (map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Option A (single entry stylesheet) -->
  <link rel="stylesheet" href="/css/main.css" />

  <!-- Page-specific styles (kept here because you asked for full edited file). -->
  <style>
    .clinic-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    .clinic-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .clinic-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 640px) {
      .clinic-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .clinic-card h3 {
      font-size: 1.05rem;
      margin-bottom: 0.5rem;
      color: var(--color-primary-dark);
    }

    .clinic-detail {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      font-size: 0.9rem;
      margin-bottom: 0.35rem;
      color: var(--color-text);
    }
    .clinic-detail svg {
      flex-shrink: 0;
      margin-top: 2px;
      color: var(--color-primary);
    }

    .clinic-services {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.75rem;
    }

    .clinic-empty {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--color-text-muted);
      grid-column: 1 / -1;
    }

    /* Map card */
    .map-card {
      padding: 0;
      overflow: hidden;
      margin-bottom: 1rem;
      border-radius: 16px;
    }
    #clinic-map { height: 360px; }

    /* Small status line */
    .status-line {
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    /* Distance badge - primary-tinted */
    .badge-distance {
      background: var(--color-primary-light, rgba(212,116,154,0.12));
      color: var(--color-primary-dark, #8a2c50);
      border: 1px solid var(--color-primary-light, rgba(212,116,154,0.35));
      font-weight: 600;
    }

    .search-wrap {
      margin-bottom: 0.75rem;
    }


    /* Status error */
    .status-error {
      color: #e53e3e !important;
      font-weight: 600;
    }

    /* Route error text inside card */
    .route-fetch-error {
      font-size: 0.85rem;
      color: #e53e3e;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    /* Selected clinic marker pulse - compositor-only (transform + opacity) */
    .clinic-marker-pulse {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-primary, #d4749a);
      will-change: transform, opacity;
      animation: markerPulse 1.6s ease-in-out infinite;
    }
    @keyframes markerPulse {
      0%, 100% { transform: scale(1);   opacity: 1;   }
      50%       { transform: scale(1.5); opacity: 0.5; }
    }
  </style>
</head>

<body>
  <main>
    <div id="banner-area"></div>

    <div class="page-header">
      <h1>Clinic Finder</h1>
      <p>Find reproductive health clinics in Jamaica </p>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <input
        class="form-input"
        type="search"
        id="search-clinics"
        placeholder="Search by name, address, or service…"
        aria-label="Search clinics"
        autocomplete="off"
      >
    </div>

    <!-- Filters -->
    <div class="clinic-filters">
      <select class="form-select" id="filter-parish" aria-label="Filter by parish">
        <option value="all">All parishes</option>
      </select>

      <select class="form-select" id="filter-type" aria-label="Filter by type">
        <option value="all">All types</option>
        <option value="hospital">Hospital</option>
        <option value="health_center">Health Centre</option>
        <option value="private">Private Practice</option>
        <option value="hotline">Hotline / Info</option>
      </select>

      <select class="form-select" id="filter-service" aria-label="Filter by service">
        <option value="all">All services</option>
      </select>
    </div>

    <!-- Actions -->
    <div class="clinic-actions">
      <button class="btn btn-outline" id="btn-locate" type="button">Use my location</button>
      <button class="btn btn-outline" id="btn-pin" type="button">Pin location on map</button>
      <span class="status-line" id="loc-status">Tip: Allow location or pin yourself on the map.</span>
    </div>

    <!-- Map -->
    <div class="card map-card">
      <div id="clinic-map"></div>
    </div>

    <!-- Results -->
    <div class="clinic-grid" id="clinic-grid">
      <div class="spinner"></div>
    </div>

    <div class="card card-centered">
      <p class="note-text">
        <strong>Note:</strong> Clinic details are sourced from public health authority directories. Always confirm hours and services directly with the clinic before visiting.
      </p>
    </div>
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module">
    import { renderNav, renderFooter, renderModeBanner } from '/js/utils.js';

    renderNav('clinics');
    renderFooter();
    renderModeBanner(document.getElementById('banner-area'));

    // Representative coordinates per parish (approx) - Jamaica-focused
    const parishCoords = {
      "Kingston": [17.997, -76.793],
      "St. Andrew": [18.012, -76.80],
      "St. Catherine": [17.996, -76.95],
      "Clarendon": [17.95, -77.24],
      "Manchester": [18.05, -77.51],
      "St. Elizabeth": [18.05, -77.77],
      "Westmoreland": [18.28, -78.15],
      "Hanover": [18.41, -78.13],
      "St. James": [18.476, -77.893],   // Montego Bay
      "Trelawny": [18.35, -77.65],
      "St. Ann": [18.44, -77.20],
      "St. Mary": [18.31, -76.97],
      "Portland": [18.18, -76.45],
      "St. Thomas": [17.92, -76.40],
    };

    const JAMAICA_CENTER = [18.1096, -77.2975];

    let clinics = [];
    window.debugClinics = () => clinics;
    let map, markersLayer;
    let userLocation = null;       // { lat, lng }
    let routeLayer = null;         // active route polyline
    let userAccuracyCircle = null; // accuracy radius circle on map
    let selectedClinicIdx = null;  // idx into currentFiltered
    let currentFiltered = [];      // last rendered filtered list

    // ----- Utilities -----
    function toRad(x) { return x * Math.PI / 180; }

    // Haversine distance in km
    function distanceKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function attachCoords(clinic) {
      // If you later add clinic.lat/clinic.lng to clinics.json, we’ll use that automatically.
      if (typeof clinic.lat === 'number' && typeof clinic.lng === 'number') return clinic;

      const coords = parishCoords[clinic.parish] || JAMAICA_CENTER;
      return { ...clinic, lat: coords[0], lng: coords[1] };
    }

    const SERVICE_LABELS = {
      OBGYN: "OB/GYN", Maternity: "Maternity", Paediatrics: "Paediatrics",
      Emergency: "Emergency", Surgery: "Surgery", MentalHealth: "Mental Health",
      Pharmacy: "Pharmacy", Radiology: "Radiology", Laboratory: "Laboratory",
      Physiotherapy: "Physiotherapy", Orthopaedics: "Orthopaedics",
      GeneralMedicine: "General Medicine", FamilyPlanning: "Family Planning",
      TeenFriendly: "Teen Friendly", HighRiskObstetrics: "High-Risk Obstetrics",
      GynecologicOncology: "Gynecologic Oncology", MinimallyInvasive: "Minimally Invasive",
      CosmeticGynecology: "Cosmetic Gynecology", Laparoscopy: "Laparoscopy",
      Ultrasound: "Ultrasound", HealthInformation: "Health Information", Referral: "Referral",
    };

    const TYPE_LABELS = {
      hospital: "Hospital", health_center: "Health Centre",
      private: "Private Practice", hotline: "Hotline",
    };

    function serviceLabel(s) { return SERVICE_LABELS[s] || s; }
    function typeLabel(t) { return TYPE_LABELS[t] || t; }
    function clinicPhone(c) {
      if (Array.isArray(c.phones) && c.phones.length) return c.phones[0];
      return c.phone || "";
    }

    let searchQuery = '';

    function getFilters() {
      return {
        query: searchQuery,
        parish: document.getElementById('filter-parish').value,
        type: document.getElementById('filter-type').value,
        service: document.getElementById('filter-service').value,
      };
    }

    function getFilteredClinics() {
      const { query, parish, type, service } = getFilters();

      let filtered = clinics;

      if (query) {
        filtered = filtered.filter(c => {
          const haystack = [
            c.name, c.address, c.parish,
            ...(c.services || []).map(serviceLabel),
            typeLabel(c.type),
          ].join(' ').toLowerCase();
          return haystack.includes(query);
        });
      }

      if (parish !== 'all') filtered = filtered.filter(c => c.parish === parish);
      if (type !== 'all') filtered = filtered.filter(c => c.type === type);
      if (service !== 'all') filtered = filtered.filter(c => (c.services || []).includes(service));

      // If user location exists, compute distance + sort near->far
      if (userLocation) {
        filtered = filtered
          .map(c => ({
            ...c,
            distance: distanceKm(userLocation.lat, userLocation.lng, c.lat, c.lng)
          }))
          .sort((a, b) => (a.distance ?? 999999) - (b.distance ?? 999999));
      } else {
        filtered = filtered.map(c => ({ ...c, distance: null }));
      }

      return filtered;
    }

    // ----- Routing -----

    function clearRoute() {
      if (routeLayer && map) { map.removeLayer(routeLayer); routeLayer = null; }
      document.querySelectorAll('.route-info').forEach(el => {
        el.style.display = 'none';
        el.innerHTML = '';
      });
    }

    function drawRoute(coords) {
      if (routeLayer && map) map.removeLayer(routeLayer);
      routeLayer = L.polyline(coords, {
        color: '#7c4dff', weight: 5, opacity: 0.85, dashArray: '10, 6',
      }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), { padding: [50, 50] });
    }

    // Academic Dijkstra fallback - runs on clinic nodes when ORS is unavailable.
    // Edges are Haversine distances; triangle inequality means the direct path
    // wins, but the algorithm is correct and demonstrates the approach.
    function dijkstraFallback(nodes, targetIdx) {
      const n = nodes.length;
      const dist = new Array(n).fill(Infinity);
      const prev = new Array(n).fill(-1);
      const visited = new Array(n).fill(false);
      dist[0] = 0; // nodes[0] = user location

      for (let iter = 0; iter < n; iter++) {
        let u = -1;
        for (let j = 0; j < n; j++) {
          if (!visited[j] && (u === -1 || dist[j] < dist[u])) u = j;
        }
        if (u === -1 || dist[u] === Infinity) break;
        visited[u] = true;
        if (u === targetIdx) break;

        for (let v = 0; v < n; v++) {
          if (visited[v]) continue;
          const w = distanceKm(nodes[u].lat, nodes[u].lng, nodes[v].lat, nodes[v].lng);
          if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
        }
      }

      const path = [];
      for (let cur = targetIdx; cur !== -1; cur = prev[cur]) path.unshift(cur);
      const km = dist[targetIdx];
      return {
        distance_km: +km.toFixed(2),
        duration_min: Math.round((km / 40) * 60), // 40 km/h average
        coords: path.map(i => [nodes[i].lat, nodes[i].lng]),
      };
    }

    async function getDirections(clinic, idx) {
      if (!userLocation) {
        setStatus('Set your location first - use "Use my location" or "Pin location on map".', true);
        return;
      }

      // Show loading state on button
      const card = document.querySelector(`.clinic-card[data-idx="${idx}"]`);
      const btn = card?.querySelector('.btn-get-directions');
      if (btn) { btn.disabled = true; btn.textContent = 'Routing…'; }

      const infoEl = document.getElementById(`route-info-${idx}`);
      if (infoEl) {
        infoEl.style.display = 'block';
        infoEl.innerHTML = '<em style="font-size:0.85rem;color:var(--color-text-muted)">Calculating route…</em>';
      }

      let result = null;
      let isFallback = false;

      try {
        const apiBase = window.BLOOM_API_BASE ?? '';
        const res = await fetch(
          `${apiBase}/catalog/route?fromLat=${userLocation.lat}&fromLng=${userLocation.lng}` +
          `&toLat=${clinic.lat}&toLng=${clinic.lng}&mode=driving-car`
        );
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || `Status ${res.status}`);
        result = data;
      } catch (err) {
        console.warn('ORS routing unavailable, using Dijkstra fallback:', err.message);
        isFallback = true;

        // Build graph: user + all currently visible clinics
        const visible = getFilteredClinics();
        const nodes = [{ lat: userLocation.lat, lng: userLocation.lng }, ...visible];
        let tIdx = nodes.findIndex(n => n.lat === clinic.lat && n.lng === clinic.lng);
        if (tIdx === -1) { nodes.push(clinic); tIdx = nodes.length - 1; }
        result = dijkstraFallback(nodes, tIdx);
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = 'Get directions'; }
      }

      drawRoute(result.coords);

      if (infoEl) {
        const tag = isFallback
          ? `<span class="badge badge-distance" style="font-size:0.75rem;margin-left:0.4rem">Straight-line est.</span>`
          : '';
        infoEl.innerHTML = `
          <div class="clinic-detail" style="margin-top:0.5rem;margin-bottom:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="3 11 22 2 13 21 11 13 3 11"/>
            </svg>
            <span><strong>${result.distance_km} km</strong> · ~${result.duration_min} min${tag}</span>
          </div>`;
      }
    }

    // ----- Map -----
    let pinMode = false;

    function initMap() {
      map = L.map("clinic-map").setView(JAMAICA_CENTER, 8);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap"
      }).addTo(map);

      markersLayer = L.layerGroup().addTo(map);

      // Click-to-pin: let user manually place their location on the map
      map.on('click', (e) => {
        if (!pinMode) return;
        pinMode = false;
        document.getElementById('clinic-map').style.cursor = '';
        document.getElementById('btn-pin').textContent = 'Pin location on map';

        userLocation = { lat: e.latlng.lat, lng: e.latlng.lng };
        setStatus('Location pinned. Showing clinics near you.');

        if (userAccuracyCircle) { map.removeLayer(userAccuracyCircle); userAccuracyCircle = null; }
        renderClinics();
      });
    }

    function togglePinMode() {
      pinMode = !pinMode;
      const btn = document.getElementById('btn-pin');
      if (pinMode) {
        btn.textContent = 'Cancel - click map to place pin';
        document.getElementById('clinic-map').style.cursor = 'crosshair';
        setStatus('Click anywhere on the map to set your location.');
      } else {
        btn.textContent = 'Pin location on map';
        document.getElementById('clinic-map').style.cursor = '';
        setStatus('Tip: Allow location or pin yourself on the map.');
      }
    }

    const pulseIcon = L.divIcon({
      className: '',
      html: '<div class="clinic-marker-pulse"></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9],
    });

    function renderMarkers(filtered) {
      if (!markersLayer) return;
      markersLayer.clearLayers();

      filtered.forEach((c, i) => {
        const popup = `
          <strong>${c.name}</strong><br>
          ${c.address}${c.parish ? ", " + c.parish : ""}<br>
          ${c.phone ? c.phone + "<br>" : ""}
          ${c.hours ? "<em>" + c.hours + "</em>" : ""}
        `;
        const marker = i === selectedClinicIdx
          ? L.marker([c.lat, c.lng], { icon: pulseIcon })
          : L.marker([c.lat, c.lng]);
        marker.addTo(markersLayer).bindPopup(popup);
      });

      // Add user marker (if available)
      if (userLocation) {
        L.circleMarker([userLocation.lat, userLocation.lng], {
          radius: 8, color: '#7c4dff', fillColor: '#7c4dff', fillOpacity: 1, weight: 2,
        }).addTo(markersLayer).bindPopup("You are here (approximate)");
      }
    }

    function selectClinic(idx) {
      selectedClinicIdx = idx;
      renderMarkers(currentFiltered);
    }

    // ----- UI Rendering -----
    function renderClinics() {
      const grid = document.getElementById('clinic-grid');
      const filtered = getFilteredClinics();
      currentFiltered = filtered;
      selectedClinicIdx = null;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="clinic-empty"><p>No clinics match your filters.</p></div>`;
        renderMarkers([]);
        return;
      }

      // Update grid
      grid.innerHTML = filtered.map((c, i) => {
        const phone = clinicPhone(c);
        return `
        <div class="card clinic-card" data-lat="${c.lat}" data-lng="${c.lng}" data-idx="${i}">
          <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:0.75rem;flex-wrap:wrap;">
            <h3 style="margin:0;">${c.name}</h3>
            <div style="display:flex;gap:0.35rem;flex-wrap:wrap;align-items:center;">
              ${c.type ? `<span class="badge" style="background:var(--color-bg-hover);color:var(--color-text-muted);">${typeLabel(c.type)}</span>` : ''}
              ${userLocation && typeof c.distance === 'number'
                ? `<span class="badge badge-distance">${c.distance.toFixed(1)} km</span>`
                : ''}
            </div>
          </div>

          <div class="clinic-detail" style="margin-top:0.5rem;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>${c.address}${c.parish ? ", " + c.parish : ""}</span>
          </div>

          ${phone ? `
            <div class="clinic-detail">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <span>${phone}</span>
            </div>
          ` : ''}

          ${c.hours ? `
            <div class="clinic-detail">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>${c.hours}</span>
            </div>
          ` : ''}

          <div class="clinic-services">
            ${(c.services || []).map(s => `<span class="badge badge-primary">${serviceLabel(s)}</span>`).join('')}
          </div>

          <div id="route-info-${i}" class="route-info" style="display:none;"></div>

          <div style="margin-top:0.9rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
            <button class="btn btn-outline btn-sm btn-focus-map" type="button">View on map</button>
            <button class="btn btn-outline btn-sm btn-get-directions" type="button">Get directions</button>
          </div>
        </div>
      `}).join('');

      // Update markers
      renderMarkers(filtered);

      // Card action: focus on map
      grid.querySelectorAll(".btn-focus-map").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const card = e.target.closest(".clinic-card");
          const idx = Number(card.dataset.idx);
          const lat = Number(card.dataset.lat);
          const lng = Number(card.dataset.lng);
          selectClinic(idx);
          if (map && Number.isFinite(lat) && Number.isFinite(lng)) {
            map.setView([lat, lng], 14);
          }
        });
      });

      // Card action: get directions
      grid.querySelectorAll(".btn-get-directions").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const card = e.target.closest(".clinic-card");
          const idx = Number(card.dataset.idx);
          selectClinic(idx);
          getDirections(filtered[idx], idx);
        });
      });
    }

    function populateFilters() {
      const parishSelect = document.getElementById('filter-parish');
      const serviceSelect = document.getElementById('filter-service');

      const parishes = [...new Set(clinics.map(c => c.parish).filter(Boolean))].sort();
      parishes.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        parishSelect.appendChild(opt);
      });

      const services = [...new Set(clinics.flatMap(c => c.services || []))].sort();
      services.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s;
        opt.textContent = serviceLabel(s);
        serviceSelect.appendChild(opt);
      });
    }

    // ----- Location -----
    function setStatus(msg, isError = false) {
      const el = document.getElementById("loc-status");
      if (!el) return;
      el.textContent = msg;
      el.classList.toggle('status-error', isError);
    }

    function requestUserLocation() {
      if (!navigator.geolocation) {
        setStatus("Location is not supported in this browser.");
        return;
      }

      setStatus("Requesting your location…");

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          const accuracyM = Math.round(pos.coords.accuracy);
          const accuracyLabel = accuracyM < 100
            ? `±${accuracyM} m (good)`
            : accuracyM < 1000
              ? `±${accuracyM} m (moderate - desktop Wi-Fi estimate)`
              : `±${(accuracyM / 1000).toFixed(1)} km (rough - IP estimate only)`;
          setStatus(`Location found · ${accuracyLabel}`);

          // Draw accuracy circle so user can see how precise the estimate is
          if (map) {
            if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);
            userAccuracyCircle = L.circle([userLocation.lat, userLocation.lng], {
              radius: pos.coords.accuracy,
              color: '#7c4dff',
              fillColor: '#7c4dff',
              fillOpacity: 0.08,
              weight: 1.5,
            }).addTo(map);
            map.setView([userLocation.lat, userLocation.lng], 11);
          }

          renderClinics();
        },
        (err) => {
          const msgs = {
            1: "Location permission denied. Use 'Pin location on map' instead.",
            2: "Location unavailable - check your browser settings.",
            3: "Location request timed out. Try again or pin manually.",
          };
          setStatus(msgs[err.code] || "Could not get location.", true);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // ----- Events -----
    document.getElementById('search-clinics').addEventListener('input', function () {
      searchQuery = this.value.trim().toLowerCase();
      try {
        renderClinics();
      } catch (err) {
        console.error('[Clinic search error]', err);
      }
    });
    document.getElementById('filter-parish').addEventListener('change', renderClinics);
    document.getElementById('filter-type').addEventListener('change', renderClinics);
    document.getElementById('filter-service').addEventListener('change', renderClinics);
    document.getElementById('btn-locate').addEventListener('click', requestUserLocation);
    document.getElementById('btn-pin').addEventListener('click', togglePinMode);


    // ----- Init -----
   async function init() {
      initMap(); // always init the map first so it renders regardless of data

      try {
        const apiBase = window.BLOOM_API_BASE ?? '';
        const res = await fetch(`${apiBase}/catalog/clinics`);

        if (!res.ok) throw new Error(`Backend error: ${res.status}`);

        const data = await res.json();
        // Backend returns { ok: true, clinics: [...] }
        clinics = (data.clinics || []).map(attachCoords);

      } catch (e) {
        console.warn('Backend fetch failed, trying local fallback:', e);

        try {
          const res = await fetch('/data/clinics.json');
          if (!res.ok) throw new Error('clinics.json not found');
          const data = await res.json();
          clinics = (data.clinics || data || []).map(attachCoords);
        } catch (e2) {
          console.warn('Local fallback also failed:', e2);
          clinics = [];
        }
      }

      populateFilters();
      renderClinics();
    }

    init();
  </script>
</body>
</html>
