<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Approved - Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />

  <style>
    .result-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 120px);
      padding: 2rem 1rem;
    }
    .result-card {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .result-icon {
      font-size: 4.5rem;
      margin-bottom: 1rem;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes pop {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }
    .result-card h1 {
      font-size: 1.7rem;
      color: var(--color-primary-dark);
      margin-bottom: 0.5rem;
    }
    .result-card .subtitle {
      color: var(--color-text-muted);
      font-size: 0.95rem;
      line-height: 1.65;
      margin-bottom: 1.75rem;
    }
  </style>
</head>

<body>
  <main class="result-page">
    <div class="card result-card">
      <div class="result-icon" aria-hidden="true">🌸</div>
      <h1>You're in! Welcome to Bloom</h1>
      <p class="subtitle">
        Your parent or guardian has approved your account.<br>
        You can now explore Bloom and start tracking your cycle.
      </p>
      <a href="/pages/login.html" class="btn btn-primary btn-block btn-lg">
        Log in to Bloom
      </a>
    </div>
  </main>

  <script type="module">
    import { renderFooter } from '/js/utils.js';
    renderFooter();
    localStorage.setItem('bloom_consent_status', 'approved');
  </script>
</body>
</html>
