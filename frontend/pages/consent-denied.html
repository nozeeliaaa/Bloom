<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Not Approved - Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />

  <style>
    .result-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 120px);
      padding: 2rem 1rem;
    }
    .result-card {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .result-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .result-card h1 {
      font-size: 1.55rem;
      color: var(--color-primary-dark);
      margin-bottom: 0.5rem;
    }
    .result-card .subtitle {
      color: var(--color-text-muted);
      font-size: 0.95rem;
      line-height: 1.65;
      margin-bottom: 1.75rem;
    }
    .denied-options {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
  </style>
</head>

<body>
  <main class="result-page">
    <div class="card result-card">
      <div class="result-icon" aria-hidden="true">💌</div>
      <h1>Your guardian denied access to Bloom</h1>
      <p class="subtitle">
        Your guardian has reviewed your request and has not approved your Bloom account at this time.
        If you think this was a mistake, please speak with your guardian directly.
      </p>

      <div class="denied-options">
        <a href="mailto:bloomhelpdesk1@gmail.com" class="btn btn-outline btn-block">
          Contact Support
        </a>
      </div>
    </div>
  </main>

  <script type="module">
    import { renderFooter } from '/js/utils.js';
    renderFooter();
    localStorage.setItem('bloom_consent_status', 'denied');
  </script>
</body>
</html>
