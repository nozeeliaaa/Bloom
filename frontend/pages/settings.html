<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bloom — Settings</title>

  <link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/main.css">
<link rel="stylesheet" href="../css/pages.css">
<link rel="stylesheet" href="../css/settings.css"> 

</head>
<body>
  <div id="banner-area"></div>

  <main class="page">
    <header class="page-header">
      <div class="page-title">
        <span class="title-icon" aria-hidden="true">
          <!-- gear icon -->
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.06 7.06 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 1h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.58.23-1.12.54-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 7.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.51.4 1.05.71 1.63.94l.36 2.54a.5.5 0 0 0 .49.42h3.8a.5.5 0 0 0 .49-.42l.36-2.54c.58-.23 1.12-.54 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5z"/></svg>
        </span>
        <h1>Settings</h1>
      </div>
      <p class="page-subtitle">Manage your preferences. You can reset anytime.</p>
    </header>

    <section class="card">
      <h2>Preferences</h2>

      <div class="stack" style="margin-top:0.75rem;">
        <label style="display:flex; flex-direction:column; gap:0.35rem; max-width:260px;">
          <strong>Theme</strong>
          <select id="pref-theme">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
            <option value="system">System</option>
          </select>
        </label>

        <label style="display:flex; align-items:center; gap:0.6rem;">
          <input type="checkbox" id="pref-hide-sensitive" />
          Hide sensitive content
        </label>

        <label style="display:flex; align-items:center; gap:0.6rem;">
          <input type="checkbox" id="pref-reminders" />
          Enable reminders (demo)
        </label>

        <div class="btn-row" style="margin-top:0.5rem;">
          <button id="save-prefs" class="btn-primary" type="button">Save Preferences</button>
          <button id="reset-prefs" class="btn-outline" type="button">Reset Preferences</button>
        </div>

        <p id="prefs-status" class="muted" style="margin:0;"></p>
      </div>
    </section>

    <section class="card">
      <h2>Danger Zone</h2>
      <p class="muted">Reset only your preferences (does not delete your cycle logs).</p>
      <div class="btn-row" style="margin-top:0.75rem;">
        <button id="reset-prefs-2" class="btn-outline" type="button">Reset Preferences</button>
      </div>
    </section>
  </main>

  <script type="module" src="/js/settings.js"></script>
</body>
</html>
