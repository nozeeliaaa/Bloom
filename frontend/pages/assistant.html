<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloomie - Bloom</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />

  <style>
    .bloomie-shell {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 0 2rem;
    }

    /* Header row */
    .bloomie-page-header {
      margin-bottom: 1.25rem;
    }

    /* Chat card */
    .bloomie-card {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 280px);
      padding: 0;
      overflow: hidden;
    }

    .bloomie-card .card-header {
      background: linear-gradient(135deg, var(--color-primary-lightest, #fce4ec) 0%, transparent 100%);
      border-bottom: 1px solid var(--color-border);
    }

    .bloomie-card-title-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .bloomie-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf82;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(76, 175, 130, 0.22);
    }

    /* Chat feed */
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      min-height: 400px;
      scrollbar-width: thin;
      scrollbar-color: #f0a0c0 transparent;
    }
    .chat-box::-webkit-scrollbar {
      width: 5px;
    }
    .chat-box::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-box::-webkit-scrollbar-thumb {
      background: #f0a0c0;
      border-radius: 99px;
    }
    .chat-box::-webkit-scrollbar-thumb:hover {
      background: #e46a94;
    }

    .msg {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
    }

    .msg.bot { justify-content: flex-start; }
    .msg.user { justify-content: flex-end; }

    /* Small bot avatar dot */
    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f8c8db, #D4749A);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .bubble {
      max-width: 75%;
      padding: 0.75rem 1rem;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      border: 1px solid var(--color-border);
      background: var(--color-bg-card, #fff);
    }

    .msg.bot .bubble {
      border-radius: 4px 18px 18px 18px;
      background: var(--color-bg-card, #fff);
      border-color: var(--color-border);
    }

    .msg.user .bubble {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
      border-radius: 18px 18px 4px 18px;
    }

    /* Quick-reply chips */
    .choices {
      margin-top: 0.65rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .reply {
      border-radius: 999px;
      padding: 0.4rem 0.9rem;
      border: 1.5px solid var(--color-border);
      background: var(--color-bg);
      cursor: pointer;
      font-weight: 700;
      font-size: 0.88rem;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }

    .reply:hover {
      border-color: var(--color-primary);
      background: var(--color-primary-lightest, #fce4ec);
      transform: translateY(-1px);
    }

    .reply--primary {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    .reply--primary:hover {
      background: var(--color-primary-dark, #b85c82);
      border-color: var(--color-primary-dark, #b85c82);
    }

    /* Input area */
    .chat-input-area {
      border-top: 1px solid var(--color-border);
      padding: 0.85rem 1rem;
      background: var(--color-bg-card, #fff);
    }

    .chat-form {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      padding: 0.7rem 1rem;
      border-radius: 999px;
      border: 1.5px solid var(--color-border);
      background: var(--color-bg);
      font: inherit;
      font-size: 0.95rem;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(212, 116, 154, 0.12);
    }

    .chat-send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--color-primary);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
      color: white;
    }

    .chat-send-btn--text {
      width: auto;
      border-radius: 999px;
      padding: 0 1.25rem;
      font: inherit;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .chat-send-btn:hover {
      background: var(--color-primary-dark, #b85c82);
      transform: scale(1.06);
    }

    .chat-send-btn:active { transform: scale(0.96); }

    .tiny-note {
      font-size: 0.76rem;
      text-align: center;
      color: var(--color-text-muted);
      margin: 0.5rem 0 0;
    }

    .bloomie-heading { margin: 0; }
    .bloomie-subheading { margin: 0.15rem 0 0; }

    .bloomie-card-name {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--color-text);
      margin: 0;
      line-height: 1.2;
    }

    .bloomie-status-dot--right { margin-left: auto; }

    @media (max-width: 640px) {
      .bubble { max-width: 88%; }
      .bloomie-card { min-height: calc(100vh - 230px); }
      .msg-avatar { display: none; }
    }

    /* Hide footer entirely on this page */
    .footer { display: none; }

    /* Navbar scroll-fade */
    .navbar {
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .navbar.scrolled-away {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-6px);
    }
  </style>
</head>

<body>
  <div id="banner-area"></div>

  <main>
    <div class="bloomie-shell">
      <section class="card bloomie-card">
        <div class="chat-box" id="chat-box" aria-live="polite"></div>

        <div class="chat-input-area">
          <form class="chat-form" id="chat-form">
            <input
              class="chat-input"
              id="chat-input"
              type="text"
              placeholder="Type your question…"
              autocomplete="off"
              maxlength="240"
            />
            <button class="chat-send-btn chat-send-btn--text" type="submit" aria-label="Send message">Send</button>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import { renderNav, renderFooter, renderModeBanner } from '/js/utils.js';
    import { getAllLogs } from '/js/db.js';
    import { getUserGoal } from '/js/goals.js';
    import { onAuthChange, getIdToken } from '/js/auth.js';
    import { mountChat } from '/js/assistant.js';
    import { fetchCycleState } from '/js/cycle-state.js';
    import { isAnonMode } from '/js/mode.js';

    function parseDateKey(dateKey) {
      return new Date(`${dateKey}T00:00:00`);
    }

    function formatDateKey(dateObj) {
      return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
    }

    function computeCycleBase(logs) {
      const periodDays = Object.keys(logs)
        .filter(k => logs[k]?.flow && logs[k].flow !== 'none')
        .sort();
      const starts = [];
      let prev = null;
      for (const d of periodDays) {
        if (!prev || (parseDateKey(d) - parseDateKey(prev)) / 86400000 > 3) starts.push(d);
        prev = d;
      }
      const lengths = [];
      for (let i = 1; i < starts.length; i++) {
        lengths.push(Math.round((parseDateKey(starts[i]) - parseDateKey(starts[i - 1])) / 86400000));
      }
      const avg = lengths.length
        ? Math.round(lengths.reduce((a, b) => a + b, 0) / lengths.length)
        : 28;
      const last = starts.length ? starts[starts.length - 1] : null;
      const next = last
        ? (() => {
            const d = parseDateKey(last);
            d.setDate(d.getDate() + avg);
            return formatDateKey(d);
          })()
        : null;
      return { cycleStarts: starts, cycleLengths: lengths, avgCycleLength: avg, nextPeriodDate: next };
    }

    renderNav('assistant');
    renderFooter();
    renderModeBanner(document.getElementById('banner-area'));

    // Fade navbar out on scroll
    window.addEventListener('scroll', () => {
      const navbar = document.querySelector('.navbar');
      if (navbar) navbar.classList.toggle('scrolled-away', window.scrollY > 40);
    }, { passive: true });

    if (isAnonMode()) {
      document.getElementById('chat-container').innerHTML = `
        <div style="text-align:center;padding:3rem 1.5rem;max-width:400px;margin:0 auto;">
          <div style="font-size:2.5rem;margin-bottom:1rem;">🔒</div>
          <h2 style="color:var(--color-primary-dark);margin-bottom:0.5rem;">Bloomie is for account holders</h2>
          <p style="color:var(--color-text-muted);margin-bottom:1.5rem;">Create a free account to chat with Bloomie, get personalised cycle insights, and more.</p>
          <a href="/pages/register.html" class="btn btn-primary">Create free account</a>
          <p style="margin-top:1rem;font-size:0.88rem;color:var(--color-text-muted);">
            Already have one? <a href="/pages/login.html" style="font-weight:700;">Log in</a>
          </p>
        </div>`;
    } else {

    async function init(user) {
      const logsByDate = await getAllLogs();
      const cycle = computeCycleBase(logsByDate);
      const cycleState = await fetchCycleState(logsByDate).catch(() => null);
      const goal = getUserGoal();

      const lastLmp = cycle.cycleStarts?.length
        ? cycle.cycleStarts[cycle.cycleStarts.length - 1]
        : null;

      const stateCycleLength = Number(cycleState?.predictedCycleLength ?? cycleState?.avgCycleLength);
      const cycleLength = Number.isFinite(stateCycleLength) && stateCycleLength > 0
        ? Math.round(stateCycleLength)
        : (cycle.avgCycleLength || null);
      const nextPeriodDate = cycleState?.nextPeriodDate || cycle.nextPeriodDate || null;

      const cycleData = {
        lmp: lastLmp,
        cycleLength,
        nextPeriodDate,
        previousCycleLengths: cycle.cycleLengths,
        cycleCount: cycle.cycleStarts.length,
        phase: cycleState?.phase || null,
        phaseLabel: cycleState?.phaseLabel || null,
        confidence: cycleState?.confidence?.level || null,
        isTrackingPregnancy: goal === 'pregnancy',
        mode: goal === 'pregnancy' ? 'pregnancy_tracking'
            : goal === 'ttc'      ? 'trying_to_conceive'
            : lastLmp             ? 'cycle_tracking'
            :                       null,
      };

      const symptomHistory = Object.entries(logsByDate)
        .filter(([, entry]) => entry.symptoms?.length)
        .map(([dateKey, entry]) => ({
          dateKey,
          items: (entry.symptoms || []).map(sym => ({
            code: sym,
            severity: entry.symptomSeverity?.[sym] ?? 3,
            note: null,
          })),
        }));

      // Fetch nickname from Firestore profile so Bloomie can address the user by name
      let enrichedUser = user;
      if (user) {
        try {
          const token = await getIdToken();
          const apiBase = window.BLOOM_API_BASE ?? '';
          const res = await fetch(`${apiBase}/api/user/profile`, {
            headers: { 'Authorization': `Bearer ${token}` },
          });
          if (res.ok) {
            const data = await res.json();
            const nickname = data?.profile?.nickname || '';
            if (nickname) enrichedUser = { ...user, nickname };
          }
        } catch (_) { /* fall back to user.displayName */ }
      }

      await mountChat(enrichedUser, cycleData, symptomHistory.length ? symptomHistory : null);
    }

      onAuthChange(user => { init(user); });
    }
  </script>
</body>
</html>
