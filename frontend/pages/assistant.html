<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bloomie - Bloom</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />

  <style>
    .bloomie-shell {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 0 2rem;
    }

    .bloomie-card {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 260px);
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 420px;
    }

    .msg {
      display: flex;
    }

    .msg.bot { justify-content: flex-start; }
    .msg.user { justify-content: flex-end; }

    .bubble {
      max-width: 80%;
      padding: 0.75rem 1rem;
      border-radius: 16px;
      background: var(--color-bg-soft);
      font-size: 0.95rem;
      line-height: 1.45;
      border: 1px solid var(--color-border);
    }

    .msg.user .bubble {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    .chat-form {
      display: flex;
      gap: 0.5rem;
      border-top: 1px solid var(--color-border);
      padding-top: 0.9rem;
      margin-top: 0.25rem;
    }

    .chat-input {
      flex: 1;
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      font: inherit;
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.04);
    }

    .choices {
      margin-top: 0.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .reply {
      border-radius: 999px;
      padding: 0.45rem 0.95rem;
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
    }

    .reply:hover { transform: translateY(-1px); }

    .reply--primary {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    .tiny-note {
      font-size: 0.78rem;
      text-align: center;
      color: var(--color-text-muted);
      margin-top: 0.9rem;
    }

    @media (max-width: 640px) {
      .bubble { max-width: 90%; }
      .bloomie-card { min-height: calc(100vh - 220px); }
    }
  </style>
</head>

<body>
  <main>
    <div id="banner-area"></div>

    <div class="bloomie-shell">
      <div class="page-header">
        <h1>Bloomie</h1>
        <p class="text-muted">Ask a question, describe a symptom, or use the quick replies 🩷</p>
      </div>

      <section class="card bloomie-card">
        <div class="card-header">
          <div>
            <div class="card-title">Chat Assistant</div>
            <div class="card-subtitle">
              Educational support for cycle, symptom, and reproductive health questions
            </div>
          </div>
        </div>

        <div class="card-body">
          <div class="chat-box" id="chat-box" aria-live="polite"></div>

          <form class="chat-form" id="chat-form">
            <input
              class="chat-input"
              id="chat-input"
              type="text"
              placeholder="Type here or use the buttons…"
              autocomplete="off"
              maxlength="240"
            />
          </form>

          <p class="tiny-note">
            Bloomie provides educational information only. This is not medical advice.
            Always consult a healthcare provider.
          </p>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import { renderNav, renderFooter, renderModeBanner } from '/js/utils.js';
    import { getAllLogs } from '/js/db.js';
    import { computeCyclePhase } from '/js/phase.js';
    import { getUserGoal } from '/js/goals.js';
    import { onAuthChange } from '/js/auth.js';
    import { mountChat } from '/js/assistant.js';

    renderNav('assistant');
    renderFooter();
    renderModeBanner(document.getElementById('banner-area'));

    async function init(user) {
      const profile = JSON.parse(localStorage.getItem("bloom_profile") || "{}");
      const isMinor = profile.ageRange === "under18";
      const isAnon  = !user;
      const logsByDate = await getAllLogs();
      const cycle = computeCyclePhase(logsByDate);
      const goal = getUserGoal();

      const lastLmp = cycle.cycleStarts?.length
        ? cycle.cycleStarts[cycle.cycleStarts.length - 1]
        : null;

      const cycleData = {
        lmp: lastLmp,
        cycleLength: cycle.avgCycleLength || null,
        nextPeriodDate: cycle.nextPeriodDate || null,
        isTrackingPregnancy: goal === 'pregnancy',
        mode: goal === 'pregnancy' ? 'pregnancy_tracking'
            : goal === 'ttc'      ? 'trying_to_conceive'
            : lastLmp             ? 'cycle_tracking'
            :                       null,
      };

      const symptomHistory = Object.entries(logsByDate)
        .filter(([, entry]) => entry.symptoms?.length)
        .map(([dateKey, entry]) => ({
          dateKey,
          items: (entry.symptoms || []).map(sym => ({
            code: sym,
            severity: entry.symptomSeverity?.[sym] ?? 3,
            note: null,
          })),
        }));

      await mountChat(user, cycleData, symptomHistory.length ? symptomHistory : null, { isMinor, isAnon });
    }

    onAuthChange(user => { init(user); });
  </script>
</body>
</html>
