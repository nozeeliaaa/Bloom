<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">


<style>
    .auth-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 120px);
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
    }
    .auth-card h1 {
      text-align: center;
      color: var(--color-primary-dark);
      margin-bottom: 0.35rem;
    }
    .auth-card .subtitle {
      text-align: center;
      color: var(--color-text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    .auth-links {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.9rem;
    }
    .auth-links a { font-weight: 600; }
    .brand-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--color-primary);
      text-decoration: none;
      margin-bottom: 1.5rem;
    }
    .brand-link svg { width: 24px; height: 24px; }
    .age-notice {
      font-size: 0.82rem;
      color: var(--color-text-muted);
      text-align: center;
      margin-top: 0.5rem;
    }
  </style>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
<body>
  <main class="auth-page">
    <div class="card auth-card">
      <a href="/pages/home.html" class="brand-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2c1.5 0 3 1.5 3 4s-1.5 4-3 4-3-1.5-3-4 1.5-4 3-4z"/><path d="M22 12c0 1.5-1.5 3-4 3s-4-1.5-4-3 1.5-3 4-3 4 1.5 4 3z"/><path d="M12 22c-1.5 0-3-1.5-3-4s1.5-4 3-4 3 1.5 3 4-1.5 4-3 4z"/><path d="M2 12c0-1.5 1.5-3 4-3s4 1.5 4 3-1.5 3-4 3-4-1.5-4-3z"/></svg>
        Bloom
      </a>
      <h1>Create Your Account</h1>
      <p class="subtitle">Unlock cloud sync, advanced insights, and data export.</p>

      <div id="error-msg" class="banner banner-warning hidden" role="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-input" type="password" id="password" name="password" required autocomplete="new-password" placeholder="At least 6 characters" minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm-password">Confirm Password</label>
          <input class="form-input" type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" placeholder="Re-enter your password">
        </div>
        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" id="age-confirm" required>
            <span>I confirm that I am <strong>18 years or older</strong></span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="register-btn">Create Account</button>
      </form>

      <p class="age-notice">You must be 18 or older to create an account.</p>

      <div class="auth-links">
        <p>Already have an account? <a href="/pages/login.html">Log in</a></p>
        <p style="margin-top:0.75rem;">
          <a href="/pages/survey.html" id="btn-anon">Continue anonymously instead</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module">
    import { showBloomLoader, runBloomLoader } from "/js/loadingOverlay.js";
    import { register } from '/js/auth.js';
    import { setMode } from '/js/mode.js';
    import { isFirebaseConfigured } from '/js/firebase.js';
    import { renderFooter } from '/js/utils.js';

    renderFooter();

    const form = document.getElementById('register-form');
    const errorMsg = document.getElementById('error-msg');
    const registerBtn = document.getElementById('register-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.classList.add('hidden');

      if (!isFirebaseConfigured()) {
        errorMsg.textContent = 'Firebase is not configured. Please set up Firebase or continue anonymously.';
        errorMsg.classList.remove('hidden');
        return;
      }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const ageConfirm = document.getElementById('age-confirm').checked;

      if (!email || !password) {
        errorMsg.textContent = 'Please fill in all fields.';
        errorMsg.classList.remove('hidden');
        return;
      }
      if (password.length < 6) {
        errorMsg.textContent = 'Password must be at least 6 characters.';
        errorMsg.classList.remove('hidden');
        return;
      }
      if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match.';
        errorMsg.classList.remove('hidden');
        return;
      }
      if (!ageConfirm) {
        errorMsg.textContent = 'You must confirm that you are 18 or older.';
        errorMsg.classList.remove('hidden');
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = 'Creating account...';

      try {
        await register(email, password);
        showBloomLoader({ message: "Welcome to Bloom", sub: "Setting up your account…" });
        await runBloomLoader({ targetUrl: "/pages/survey.html" });
      } catch (err) {
        let msg = 'Registration failed. Please try again.';
        if (err.code === 'auth/email-already-in-use') {
          msg = 'An account with this email already exists.';
        } else if (err.code === 'auth/weak-password') {
          msg = 'Password is too weak. Please use at least 6 characters.';
        } else if (err.code === 'auth/invalid-email') {
          msg = 'Please enter a valid email address.';
        }
        errorMsg.textContent = msg;
        errorMsg.classList.remove('hidden');
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = 'Create Account';
      }
    });

    document.getElementById('btn-anon').addEventListener('click', () => {
      setMode('anon');
    });
  </script>
</body>
</html>
