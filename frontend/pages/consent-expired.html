<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Expired - Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />

  <style>
    .result-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 120px);
      padding: 2rem 1rem;
    }
    .result-card {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }
    .result-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    .result-card h1 {
      font-size: 1.55rem;
      color: var(--color-primary-dark);
      margin-bottom: 0.5rem;
    }
    .result-card .subtitle {
      color: var(--color-text-muted);
      font-size: 0.95rem;
      line-height: 1.65;
      margin-bottom: 1.75rem;
    }
    .expired-meta {
      font-size: 0.85rem;
      color: var(--color-text-muted);
      background: var(--color-bg-subtle, #f8f4f7);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 0.65rem 0.9rem;
      margin-bottom: 1.25rem;
    }
    .expired-actions {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
  </style>
</head>

<body>
  <main class="result-page">
    <div class="card result-card">
      <div class="result-icon" aria-hidden="true">⏳</div>
      <h1>This approval link has expired</h1>
      <p class="subtitle">
        Consent links are valid for 72 hours. This one is no longer active -
        but don't worry, you can send a fresh one right away.
      </p>

      <div class="expired-meta" id="request-meta">
        Loading request details…
      </div>

      <div class="expired-actions">
        <button class="btn btn-primary btn-block btn-lg" id="resend-btn" type="button">
          Send a New Consent Request
        </button>
        <a href="mailto:Bloomhelpdesk@outlook.com" class="btn btn-outline btn-block">
          Contact Support
        </a>
      </div>

      <div id="error-msg" class="banner banner-warning hidden" role="alert" style="margin-top:1rem;"></div>
      <div id="success-msg" class="banner banner-success hidden" role="status" style="margin-top:1rem;"></div>
    </div>
  </main>

  <script type="module">
    import { onAuthChange, getIdToken } from '/js/auth.js';
    import { renderFooter } from '/js/utils.js';

    renderFooter();

    const requestMeta = document.getElementById('request-meta');
    const resendBtn   = document.getElementById('resend-btn');
    const errorMsg    = document.getElementById('error-msg');
    const successMsg  = document.getElementById('success-msg');

    function showError(msg)   { errorMsg.textContent = msg; errorMsg.classList.remove('hidden'); successMsg.classList.add('hidden'); }
    function showSuccess(msg) { successMsg.textContent = msg; successMsg.classList.remove('hidden'); errorMsg.classList.add('hidden'); }

    onAuthChange(async (user) => {
      if (!user) {
        // Guardian landing here after clicking an expired link - just show the static message
        requestMeta.textContent = 'This link has expired. Please ask the account holder to send a new request.';
        resendBtn.style.display = 'none';
        return;
      }

      // Teen is logged in - fetch their consent details
      try {
        const token   = await getIdToken();
        const apiBase = window.BLOOM_API_BASE || 'http://localhost:4000';
        const res     = await fetch(`${apiBase}/api/consent/status`, {
          headers: { 'Authorization': `Bearer ${token}` },
        });
        const data = await res.json();

        if (data.requestedAt) {
          const sent = new Date(data.requestedAt._seconds * 1000);
          requestMeta.textContent = `Original request sent: ${sent.toLocaleDateString('en-JM', { dateStyle: 'long' })} · Sent to: ${data.guardianEmail || 'your guardian'}`;
        } else {
          requestMeta.textContent = 'No active consent request found.';
        }
      } catch (_) {
        requestMeta.textContent = 'Could not load request details.';
      }

      resendBtn.addEventListener('click', async () => {
        errorMsg.classList.add('hidden');
        resendBtn.disabled    = true;
        resendBtn.textContent = 'Sending…';

        try {
          const token   = await getIdToken();
          const apiBase = window.BLOOM_API_BASE || 'http://localhost:4000';
          const res     = await fetch(`${apiBase}/api/consent/resend`, {
            method:  'POST',
            headers: { 'Authorization': `Bearer ${token}` },
          });
          const data = await res.json();

          if (!res.ok) {
            showError(data.error || 'Could not resend. Please try again.');
            return;
          }

          showSuccess('New request sent! Ask your guardian to check their inbox.');
          localStorage.setItem(`bloom_consent_status_${user.uid}`, 'pending');
          setTimeout(() => { window.location.href = '/pages/consent-pending.html'; }, 1800);
        } catch (_) {
          showError('Could not send. Please check your connection.');
        } finally {
          resendBtn.disabled    = false;
          resendBtn.textContent = 'Send a New Consent Request';
        }
      });
    });
  </script>
</body>
</html>
