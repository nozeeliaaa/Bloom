<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - Bloom</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css" />

  <style>
    .profile-header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 1rem;
    }

    .profile-mini{
      display:flex;
      align-items:center;
      gap: 0.85rem;
      margin-top: 0.75rem;
    }

    .profile-mini-avatar{
      width: 54px;
      height: 54px;
      border-radius: 999px;
      display:grid;
      place-items:center;
      border: 1px solid var(--color-border);
      background: var(--color-card);
      font-size: 26px;
      -webkit-user-select:none;
      user-select:none;
    }

    .profile-mini-name{
      font-weight: 800;
      margin: 0;
      line-height: 1.1;
    }

    .profile-mini-sub{
      margin: 0.2rem 0 0;
      font-size: 0.9rem;
      color: var(--color-text-muted);
    }

    /* Goals */
    .goals-grid{
      display:grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    @media (min-width: 860px){
      .goals-grid{
        grid-template-columns: 1fr 1fr;
      }
    }

    .goal-card{
      border: 1px solid var(--color-border);
      background: var(--color-card);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      text-align:left;
      cursor:pointer;
      transition: transform 0.06s ease, border-color 0.12s ease;
      display:flex;
      gap: 0.85rem;
      align-items:flex-start;
    }
    .goal-card:hover{ transform: translateY(-1px); }
    .goal-card.active{
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(216, 90, 152, 0.15);
    }

    .goal-badge{
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display:grid;
      place-items:center;
      background: rgba(216, 90, 152, 0.10);
      color: var(--color-primary);
      font-weight: 900;
      flex: 0 0 auto;
    }
    .goal-badge svg { width: 22px; height: 22px; }

    .goal-title{
      margin: 0;
      font-weight: 900;
      font-size: 1rem;
      line-height: 1.2;
    }
    .goal-desc{
      margin: 0.25rem 0 0;
      color: var(--color-text-muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .goal-meta{
      margin-top: 0.75rem;
      color: var(--color-text-muted);
      font-size: 0.92rem;
    }
    .goal-meta-desc { margin-top: 0.25rem; }
    .goal-meta-actions { margin-top: 0.5rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .list-card{
      padding: 0;
      overflow: hidden;
      margin-top: 1rem;
    }

    .list-link{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding: 15px 18px;
      border-bottom: 1px solid var(--color-border);
      text-decoration:none;
      color: var(--color-text);
      font-weight: 700;
      transition: background 0.12s ease;
    }
    .list-link:hover { background: var(--color-primary-lightest); }
    .list-link:last-child{ border-bottom:none; }
    .list-link-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }
    .list-link-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--color-primary-lightest);
      color: var(--color-primary);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .list-link-icon svg { width: 18px; height: 18px; }
    .list-link-arrow {
      color: var(--color-text-muted);
      font-size: 1.1rem;
    }

    .legal-links{
      display:flex;
      flex-wrap:wrap;
      gap: 0.75rem 1rem;
      justify-content:center;
      padding: 1rem 0 0.25rem;
      font-size: 0.92rem;
    }
    .legal-links a{
      color: var(--color-text-muted);
      text-decoration: none;
      font-weight: 700;
    }
    .legal-links a:hover{ color: var(--color-primary); }

    .profile-header-actions {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 1.25rem;
      flex-shrink: 0;
    }


  </style>
</head>

<body>
  <main>
    <div id="banner-area"></div>

    <div class="page-header profile-header">
      <div>
        <h1>Your Profile</h1>
        <p class="text-muted">Quick access to your profile, settings, and support.</p>

        <div class="profile-mini">
          <div class="profile-mini-avatar" id="mini-avatar">👤</div>
          <div>
            <p class="profile-mini-name" id="mini-name">Guest</p>
            <p class="profile-mini-sub" id="mini-sub">Tap “View Profile” to edit details</p>
          </div>
        </div>
      </div>

      <div class="profile-header-actions">
        <button class="btn btn-outline btn-logout-profile" id="profile-logout-btn" type="button" hidden>Log out</button>
        <a class="btn btn-outline" href="/pages/profile-view.html">View Profile</a>
      </div>
    </div>

    <section class="card">
      <h2>Goal</h2>
      <p class="text-muted">
        Your dashboard and tools change based on the goal you pick. Switching goals does <strong>not</strong> delete your previous logs.
      </p>

      <div class="goals-grid" id="goals-grid"></div>

      <div class="goal-meta" id="goal-meta"></div>
    </section>

    <div class="card list-card">
      <a class="list-link" href="/pages/report.html">
        <span class="list-link-left">
          <span class="list-link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </span>
          Report for a Doctor
        </span>
        <svg class="list-link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
      <a class="list-link" href="/pages/settings.html">
        <span class="list-link-left">
          <span class="list-link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </span>
          Settings
        </span>
        <svg class="list-link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
      <a class="list-link" href="/pages/help.html">
        <span class="list-link-left">
          <span class="list-link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </span>
          Help
        </span>
        <svg class="list-link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
      <a class="list-link" href="/pages/about.html">
        <span class="list-link-left">
          <span class="list-link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </span>
          About Bloom
        </span>
        <svg class="list-link-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </a>
    </div>


  </main>

  <script type="module">
    import { renderNav, renderFooter, renderModeBanner } from "/js/utils.js";
    import { onAuthChange, logout, getIdToken } from "/js/auth.js";
    import { GOALS, getUserGoal, setUserGoal, goalLabel, goalDesc } from "/js/goals.js";

    async function syncGoalToBackend(goalId) {
      try {
        const token = await getIdToken();
        if (!token) return;
        const apiBase = window.BLOOM_API_BASE || "";
        await fetch(`${apiBase}/api/user/profile`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify({ goal: goalId }),
        });
      } catch (_) {}
    }

    renderNav("profile");
    renderFooter();
    renderModeBanner(document.getElementById("banner-area"));

    // Mini profile display (frontend-only fields)
    const LS_PROFILE = "bloom_profile";
    const LS_AVATAR  = "bloom_avatar";

    function loadProfile(){
      try { return JSON.parse(localStorage.getItem(LS_PROFILE)) || {}; }
      catch { return {}; }
    }

    function updateMiniProfile(user){
      const avatar = localStorage.getItem(LS_AVATAR) || "👤";
      document.getElementById("mini-avatar").textContent = avatar;

      const p = loadProfile();
      const nickname = (p.nickname || "").trim();

      const name = nickname || (user?.email ? user.email.split("@")[0] : "Guest");
      document.getElementById("mini-name").textContent = name;

      document.getElementById("mini-sub").textContent =
        user ? "Signed in • View Profile to edit details" : "Not signed in • View Profile to edit details";
    }

    onAuthChange((user) => {
      updateMiniProfile(user);
      const logoutBtn = document.getElementById("profile-logout-btn");
      if (logoutBtn) logoutBtn.hidden = !user;
    });

    document.getElementById("profile-logout-btn")?.addEventListener("click", async () => {
      await logout();
      window.location.href = "/pages/login.html";
    });

    // Goal cards
    const grid = document.getElementById("goals-grid");
    const meta = document.getElementById("goal-meta");

    const GOAL_ICONS = {
      period: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
      ttc:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`,
      track_symptoms: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>`,
      pregnancy: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`,
      perimenopause: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`,
    };
    function goalIcon(goalId){ return GOAL_ICONS[goalId] || GOAL_ICONS.period; }

    function renderGoals(){
      const current = getUserGoal();
      grid.innerHTML = "";

      GOALS.forEach(g => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "goal-card" + (g.id === current ? " active" : "");
        btn.innerHTML = `
          <div class="goal-badge">${goalIcon(g.id)}</div>
          <div>
            <p class="goal-title">${g.title}</p>
            <p class="goal-desc">${g.desc}</p>
          </div>
        `;

        btn.addEventListener("click", () => {
          const now = getUserGoal();
          if (g.id === now) return;
          showGoalModal(g, now === "pregnancy");
        });

        grid.appendChild(btn);
      });
    }

    function updateMeta(){
      const current = getUserGoal();
      meta.innerHTML = `
        <strong>Current goal:</strong> ${goalLabel(current)}
        <div class="goal-meta-desc">${goalDesc(current)}</div>
        <div class="goal-meta-actions">
          <a class="btn btn-primary" href="/pages/dashboard.html">Go to Dashboard</a>
          <a class="btn btn-outline" href="/pages/calendar.html">Open Calendar</a>
        </div>
      `;
    }

    function showGoalModal(goal, leavingPregnancy) {
      // Build modal markup
      const el = document.createElement("div");
      el.innerHTML = `
        <div id="gtm-overlay" style="
          position:fixed;inset:0;z-index:9999;
          background:rgba(0,0,0,0.48);
          display:flex;align-items:center;justify-content:center;
          padding:1rem;
          opacity:0;transition:opacity 0.2s ease;
        ">
          <div id="gtm-card" style="
            background:#fff;
            border-radius:18px;
            padding:2rem 1.75rem 1.75rem;
            max-width:420px;width:100%;
            box-shadow:0 24px 60px rgba(0,0,0,0.18);
            text-align:center;
            transform:translateY(14px);
            transition:transform 0.22s ease;
            color:#1a1a2e;
          ">
            <div id="gtm-icon" style="
              width:56px;height:56px;border-radius:50%;
              background:rgba(216,90,152,0.12);
              color:#d85a98;
              display:flex;align-items:center;justify-content:center;
              margin:0 auto 1rem;
            ">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M8 12l3 3 5-5"/>
              </svg>
            </div>
            <h2 id="gtm-title" style="margin:0 0 0.5rem;font-size:1.2rem;font-weight:800;color:#1a1a2e;line-height:1.3;"></h2>
            <p id="gtm-body" style="margin:0 0 0.25rem;font-size:0.95rem;color:#555;line-height:1.6;"></p>
            <p id="gtm-warn" style="margin:0 0 0;font-size:0.88rem;color:#c0392b;line-height:1.5;"></p>
            <div style="
              background:rgba(216,90,152,0.07);
              border-radius:10px;padding:0.75rem 1rem;
              margin:1rem 0 1.4rem;
              font-size:0.87rem;color:#555;
              text-align:left;display:flex;gap:0.6rem;align-items:flex-start;
            ">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#d85a98" stroke-width="2" style="flex-shrink:0;margin-top:1px;">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
              <span id="gtm-privacy">Your previous logs are still safe - we never delete your history. We do not share or sell your data.</span>
            </div>
            <div id="gtm-actions" style="display:flex;flex-direction:column;gap:0.6rem;"></div>
          </div>
        </div>
      `;

      // Store refs BEFORE appending (moving to DOM detaches from el)
      const overlay  = el.querySelector("#gtm-overlay");
      const card     = el.querySelector("#gtm-card");
      const titleEl  = el.querySelector("#gtm-title");
      const bodyEl   = el.querySelector("#gtm-body");
      const warnEl   = el.querySelector("#gtm-warn");
      const iconEl   = el.querySelector("#gtm-icon");
      const actionsEl = el.querySelector("#gtm-actions");

      // Clamp card height so it never overflows viewport
      card.style.overflowY = "auto";
      card.style.maxHeight = "90vh";

      document.body.appendChild(overlay);

      // Dark-mode: use CSS var for card bg if available
      const cardBg   = getComputedStyle(document.documentElement).getPropertyValue("--color-card").trim();
      const cardText = getComputedStyle(document.documentElement).getPropertyValue("--color-text").trim();
      if (cardBg)   card.style.background = cardBg;
      if (cardText) { card.style.color = cardText; titleEl.style.color = cardText; }

      // Fade in
      requestAnimationFrame(() => {
        overlay.style.opacity = "1";
        card.style.transform = "translateY(0)";
      });

      function showConfirm() {
        titleEl.textContent = `Switch to "${goal.title}"?`;
        bodyEl.textContent  = "Your dashboard and tools will update, but your logs are always kept.";
        if (leavingPregnancy) {
          warnEl.textContent = "Note: Switching away from the pregnancy goal will clear your saved LMP date.";
        }
        actionsEl.innerHTML = "";

        const confirmBtn = document.createElement("button");
        confirmBtn.textContent = "Yes, switch goal";
        confirmBtn.style.cssText = "padding:0.75rem 1rem;border-radius:10px;border:none;background:#d85a98;color:#fff;font-weight:800;font-size:1rem;cursor:pointer;font-family:inherit;";
        confirmBtn.onclick = () => {
          if (leavingPregnancy) localStorage.removeItem("bloom_lmp");
          setUserGoal(goal.id);
          syncGoalToBackend(goal.id);
          renderGoals();
          updateMeta();
          showSuccess();
        };

        const cancelBtn = document.createElement("button");
        cancelBtn.textContent = "Cancel";
        cancelBtn.style.cssText = "padding:0.72rem 1rem;border-radius:10px;border:2px solid #ddd;background:transparent;color:#555;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;";
        cancelBtn.onclick = close;

        actionsEl.appendChild(confirmBtn);
        actionsEl.appendChild(cancelBtn);
      }

      function showSuccess() {
        titleEl.textContent = `Dashboard ready for "${goal.title}"`;
        bodyEl.textContent  = "Your view has been updated. Tap below whenever you're ready.";
        warnEl.textContent  = "";

        // Swap icon to checkmark
        iconEl.innerHTML = `
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        `;

        actionsEl.innerHTML = "";

        const dashBtn = document.createElement("a");
        dashBtn.href = "/pages/dashboard.html";
        dashBtn.textContent = "Go to Dashboard";
        dashBtn.style.cssText = "padding:0.75rem 1rem;border-radius:10px;background:#d85a98;color:#fff;font-weight:800;font-size:1rem;text-align:center;text-decoration:none;display:block;";

        const stayBtn = document.createElement("button");
        stayBtn.textContent = "Stay on Profile";
        stayBtn.style.cssText = "padding:0.72rem 1rem;border-radius:10px;border:2px solid #ddd;background:transparent;color:#555;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit;";
        stayBtn.onclick = close;

        actions.appendChild(dashBtn);
        actions.appendChild(stayBtn);
      }

      function close() {
        overlay.style.opacity = "0";
        card.style.transform = "translateY(14px)";
        overlay.addEventListener("transitionend", () => overlay.remove(), { once: true });
      }

      overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
      showConfirm();
    }

    renderGoals();
    updateMeta();
  </script>
</body>
</html>
