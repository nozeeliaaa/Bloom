<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - Bloom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">



<style>
    .calendar-wrapper {
      max-width: 600px;
      margin: 0 auto;
    }
    .calendar-cell {
      min-height: 44px;
      font-size: 0.9rem;
    }
    @media (min-width: 640px) {
      .calendar-cell {
        min-height: 56px;
        font-size: 1rem;
      }
    }
    .flow-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      position: absolute;
      bottom: 3px;
    }
    .flow-spotting { background: #F0C6D4; }
    .flow-light { background: #E8A0BF; }
    .flow-medium { background: #D4749A; }
    .flow-heavy { background: #B85C82; }
    .modal-symptoms {
      max-height: 200px;
      overflow-y: auto;
    }
    .key-heading {
      margin-top: 0;
    }
    .delete-log-btn {
      margin-right: auto;
      display: none;
    }
  </style>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
<body>
  <main>
    <div id="banner-area"></div>

    <div class="page-header">
      <h1>Calendar</h1>
      <p>Tap a day to log your flow, symptoms, and notes</p>
    </div>

    <div class="calendar-wrapper">
      <div class="calendar-nav">
        <button id="prev-month" aria-label="Previous month">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Prev
        </button>
        <h3 id="month-label"></h3>
        <button id="next-month" aria-label="Next month">
          Next
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="calendar-grid" id="calendar-grid" role="grid" aria-label="Calendar">
        <div role="row">
          <div class="calendar-header-cell" role="columnheader">Sun</div>
          <div class="calendar-header-cell" role="columnheader">Mon</div>
          <div class="calendar-header-cell" role="columnheader">Tue</div>
          <div class="calendar-header-cell" role="columnheader">Wed</div>
          <div class="calendar-header-cell" role="columnheader">Thu</div>
          <div class="calendar-header-cell" role="columnheader">Fri</div>
          <div class="calendar-header-cell" role="columnheader">Sat</div>
        </div>
      </div>

      <section class="card">
        <h3 class="key-heading">Key</h3>
        <div class="key-grid">
          <div class="key-item"><span class="key-swatch swatch-period"></span> Logged period day</div>
          <div class="key-item"><span class="key-swatch swatch-predicted"></span> Predicted period day</div>
          <div class="key-item"><span class="key-swatch swatch-ovulation"></span> Ovulation day</div>
          <div class="key-item"><span class="key-swatch swatch-fertile"></span> Fertility days</div>
        </div>
      </section>
    </div>
  </main>

  <!-- Log Modal -->
  <div class="modal-overlay" id="log-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal" tabindex="-1">
      <div class="modal-header">
        <h3 id="modal-title">Log Entry</h3>
        <button class="modal-close" aria-label="Close" id="modal-close-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form id="log-form">
        <div class="form-group">
          <label class="form-label">Flow</label>
          <div class="chip-group" id="flow-chips"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Symptoms</label>
          <div class="chip-group modal-symptoms" id="symptom-chips"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="severity">Overall Severity (1-5)</label>
          <div class="severity-input">
            <span class="severity-label">1</span>
            <input type="range" id="severity" min="1" max="5" value="1">
            <span class="severity-label" id="severity-value">1</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="notes">Notes</label>
          <textarea class="form-textarea" id="notes" placeholder="Any additional notes..." rows="3"></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline delete-log-btn" id="delete-log-btn">Delete</button>
          <button type="button" class="btn btn-outline" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Log</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/js/calendar.js"></script>
</body>
</html>
