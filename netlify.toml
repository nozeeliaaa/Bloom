[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "serverless-http", "cors", "express-rate-limit", "firebase-admin", "dotenv", "nodemailer", "node-cron"]
  included_files = ["backend/src/**"]

[[redirects]]
  from = "/api"
  to = "/.netlify/functions/api/api"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/catalog"
  to = "/.netlify/functions/api/catalog"
  status = 200
  force = true

[[redirects]]
  from = "/catalog/*"
  to = "/.netlify/functions/api/catalog/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
